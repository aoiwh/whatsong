<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#E7E7E4"/>
  <rect width="512" height="512" rx="120" fill="none" stroke="#111111" stroke-width="4"/>
  
  <!-- Microphone icon -->
  <g transform="translate(256, 195)">
    <!-- Mic body -->
    <rect x="-36" y="-72" width="72" height="110" rx="36" fill="none" stroke="#111111" stroke-width="6"/>
    <!-- Mic stand top -->
    <line x1="-55" y1="38" x2="55" y2="38" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <!-- Mic stand vertical -->
    <line x1="0" y1="38" x2="0" y2="90" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <!-- Mic stand base -->
    <line x1="-40" y1="90" x2="40" y2="90" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- App name -->
  <text x="256" y="390" text-anchor="middle" font-family="'DM Mono', 'Courier New', monospace" font-size="42" font-weight="700" fill="#111111" letter-spacing="4">WHATSONG</text>
  
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="22" fill="#555555" letter-spacing="3">KTV 歌单管理</text>
</svg>
